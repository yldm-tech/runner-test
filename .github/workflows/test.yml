name: Test Self-Hosted Runner

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Display system information
          run: |
            echo "=== System Information ==="
            echo "Hostname: $(hostname)"
            echo "OS: $(uname -s)"
            echo "Architecture: $(uname -m)"
            echo "macOS Version: $(sw_vers -productVersion)"
            echo ""

        - name: Display environment
          run: |
            echo "=== Environment ==="
            echo "User: $(whoami)"
            echo "Home: $HOME"
            echo "Path: $PATH"
            echo "Working Directory: $(pwd)"
            echo ""

        - name: Test Xcode
          run: |
            echo "=== Xcode Information ==="
            if command -v xcodebuild &> /dev/null; then
              xcodebuild -version
              echo ""
              echo "Available SDKs:"
              xcodebuild -showsdks
              echo ""
              echo "Installed Simulators:"
              xcrun simctl list devices available | grep -v "unavailable"
            else
              echo "Xcode not found"
            fi
            echo ""

        - name: Test Swift
          run: |
            echo "=== Swift Information ==="
            if command -v swift &> /dev/null; then
              swift --version
              echo ""
              echo "Swift Package Manager:"
              swift package --version
            else
              echo "Swift not found"
            fi
            echo ""

        - name: Test CocoaPods
          run: |
            echo "=== CocoaPods Information ==="
            if command -v pod &> /dev/null; then
              echo "CocoaPods version: $(pod --version)"
            else
              echo "CocoaPods not installed"
            fi
            echo ""

        - name: Test Fastlane
          run: |
            echo "=== Fastlane Information ==="
            if command -v fastlane &> /dev/null; then
              fastlane --version
            else
              echo "Fastlane not installed"
            fi
            echo ""

        - name: Test Node.js (for React Native)
          run: |
            echo "=== Node.js Information ==="
            if command -v node &> /dev/null; then
              echo "Node.js version: $(node --version)"
              echo "npm version: $(npm --version)"
            else
              echo "Node.js not found"
            fi
            echo ""

        - name: List directory contents
          run: |
            echo "=== Repository Contents ==="
            ls -la

        - name: Run simple calculation
          run: |
            echo "=== Simple Test ==="
            echo "2 + 2 = $((2 + 2))"
            echo "✅ Test completed successfully!"
